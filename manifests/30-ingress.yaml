apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vlta-python-ingress
  namespace: vlta-dev
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: vlta-python-svc
            port:
              number: 80

